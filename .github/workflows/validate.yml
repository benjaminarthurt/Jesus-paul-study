name: Validate research and site
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run test:validator
      - run: npm run check
      - run: npm run build
        env:
          # Synthetic origin exercises canonical generation; not a deployment URL.
          PUBLIC_SITE_URL: https://site.example.test
      - run: npm run test:site
        env:
          PUBLIC_SITE_URL: https://site.example.test
