name: Publish research site
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci --no-audit --no-fund
      - run: npm run test:validator && npm run check
      - name: Build and audit the configured Pages path
        run: npm run build && npm run test:site
        env:
          PUBLIC_SITE_URL: ${{ steps.pages.outputs.origin }}
          PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PUBLIC_BUILD_SHA: ${{ github.sha }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public pages, styles and deployed revision
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: node scripts/verify-deployment.mjs "$PAGE_URL" "$GITHUB_SHA"
